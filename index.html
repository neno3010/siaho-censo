<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIAHO Censo Móvil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #0284c7; --accent: #4f46e5; --bg: #f1f5f9; }
        body { background-color: var(--bg); font-family: system-ui, -apple-system, sans-serif; padding-bottom: 90px; }
        .card-custom { border: none; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); transition: transform 0.2s; position: relative; }
        
        /* Contenedor e Imagen del Listado Blindados */
        .avatar-container { width: 60px; height: 60px; min-width: 60px; position: relative; overflow: hidden; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.1); background-color: #f8fafc; }
        .img-avatar { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #e2e8f0; z-index: 1000; }
        .nav-item-custom { text-align: center; color: #64748b; text-decoration: none; font-size: 0.75rem; }
        .nav-item-custom.active { color: var(--primary); font-weight: bold; }
        .nav-item-custom i { font-size: 1.3rem; display: block; margin-bottom: 2px; }
        .fab-add { width: 52px; height: 52px; background: linear-gradient(135deg, var(--primary), var(--accent)); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; margin-top: -28px; border: 4px solid #fff; box-shadow: 0 4px 10px rgba(2,132,199,0.3); }
        
        .search-box { position: sticky; top: 0; z-index: 100; background: var(--bg); padding: 12px 0; }
        .search-box input { border-radius: 20px; padding-left: 40px; background: #fff; }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        
        /* Zona de carga en el Formulario */
        .upload-zone { width: 110px; height: 110px; border: 2px dashed #cbd5e1; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; position: relative; overflow: hidden; background: #fff; cursor: pointer; }
        .upload-zone img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }

        .toast-notificacion { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 2000; display: none; background: #1e293b; color: #fff; padding: 12px 24px; border-radius: 30px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); font-weight: 500; font-size: 0.9rem; animation: slideDown 0.3s forwards; }
        @keyframes slideDown { from { top: -50px; opacity: 0; } to { top: 20px; opacity: 1; } }
    </style>
</head>
<body>

<div id="alertaFlotante" class="toast-notificacion"></div>

<div class="container pt-3">
    <div class="d-flex justify-content-between align-items-center mb-2">
        <div>
            <h4 class="mb-0 fw-bold text-dark">SIAHO Móvil</h4>
            <small class="text-muted">Saberes Ancestrales</small>
        </div>
        <div class="text-end">
            <span class="badge bg-success mb-1" id="estadoConexion" style="font-size:0.65rem; border-radius:10px;">Sincronizado</span>
            <h4 class="mb-0 fw-bold text-primary" id="statTotal">0</h4>
        </div>
    </div>

    <div class="search-box position-relative">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="inputBuscar" class="form-control shadow-sm border-0" placeholder="Buscar por nombre o cédula...">
    </div>

    <div id="listaMovil" class="mt-2">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="text-muted mt-2" style="font-size:0.85rem">Actualizando registros...</p>
        </div>
    </div>
</div>

<div class="bottom-nav">
    <a href="#" class="nav-item-custom active" onclick="window.location.reload(); return false;">
        <i class="fa-solid fa-box-archive"></i>Registros
    </a>
    <a href="#" class="nav-item-custom" onclick="abrirParaCrear(); return false;">
        <div class="fab-add"><i class="fa-solid fa-plus"></i></div>
        Nuevo
    </a>
    <a href="#" class="nav-item-custom" onclick="notificar('📊 Módulo de analíticas listo', '#0284c7'); return false;">
        <i class="fa-solid fa-chart-pie"></i>Estadísticas
    </a>
</div>

<div class="modal fade" id="modalRegistro" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-fullscreen-sm-down modal-lg">
        <div class="modal-content border-0">
            <div class="modal-header bg-light border-0 py-3">
                <h6 class="modal-title fw-bold text-secondary" id="modalTitulo">NUEVO CENSO</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="formularioCenso">
                <input type="hidden" id="action_type" value="CREAR">
                <div class="modal-body p-3">
                    
                    <div class="text-center mb-4">
                        <div class="upload-zone shadow-sm" onclick="document.getElementById('fotoFile').click()">
                            <i class="fa-solid fa-camera fa-2x text-muted" id="iconoCamara"></i>
                            <div id="previewCont"></div>
                        </div>
                        <div class="mt-1"><small class="text-primary fw-bold" style="font-size:0.75rem; cursor:pointer;" onclick="document.getElementById('fotoFile').click()">Cargar Foto del Cultor</small></div>
                        <input type="file" class="d-none" id="fotoFile" accept="image/*">
                    </div>

                    <div class="row g-2">
                        <p class="fw-bold text-secondary mb-1" style="font-size:0.75rem;">1. UBICACIÓN TERRITORIAL</p>
                        <div class="col-6"><input type="text" class="form-control form-control-sm" id="municipio" placeholder="Municipio" required></div>
                        <div class="col-6"><input type="text" class="form-control form-control-sm" id="parroquia" placeholder="Parroquia" required></div>
                        <div class="col-6"><input type="text" class="form-control form-control-sm" id="comuna" placeholder="Comuna" required></div>
                        <div class="col-6"><input type="text" class="form-control form-control-sm" id="comunidad" placeholder="Comunidad" required></div>

                        <p class="fw-bold text-secondary mb-1 mt-3" style="font-size:0.75rem;">2. DATOS PERSONALES</p>
                        <div class="col-6"><input type="text" class="form-control form-control-sm" id="cedula" placeholder="Cédula de Identidad" required></div>
                        <div class="col-6"><input type="date" class="form-control form-control-sm" id="fechanacimiento"></div>
                        <div class="col-12"><input type="text" class="form-control form-control-sm" id="nombre" placeholder="Nombres y Apellidos" required></div>
                        <div class="col-12">
                            <select class="form-select form-select-sm" id="sexo">
                                <option value="" disabled selected>Seleccione Género</option>
                                <option value="Masculino">Masculino</option>
                                <option value="Femenino">Femenino</option>
                                <option value="Otro">Otro / No definido</option>
                            </select>
                        </div>

                        <p class="fw-bold text-secondary mb-1 mt-3" style="font-size:0.75rem;">3. SABERES Y DETALLES ANCESTRALES</p>
                        <div class="col-6"><input type="text" class="form-control form-control-sm" id="especialidad" placeholder="Especialidad" required></div>
                        <div class="col-6"><input type="text" class="form-control form-control-sm" id="artesania" placeholder="Artesanía que realiza"></div>
                        <div class="col-12"><input type="text" class="form-control form-control-sm" id="dequienaprendio" placeholder="¿De quién aprendió?"></div>
                        <div class="col-12"><input type="text" class="form-control form-control-sm" id="enfermedadesquetrata" placeholder="Enfermedades que trata"></div>
                        <div class="col-12"><input type="text" class="form-control form-control-sm" id="plantasoproductosqueusa" placeholder="Plantas o productos que usa"></div>
                        <div class="col-12"><textarea class="form-control form-control-sm" id="observaciones" rows="2" placeholder="Observaciones generales..."></textarea></div>
                    </div>

                </div>
                <div class="modal-footer border-0 bg-light py-2">
                    <button type="button" class="btn btn-light btn-sm text-muted" data-bs-dismiss="modal">Cerrar</button>
                    <button type="submit" class="btn btn-primary btn-sm px-4 fw-bold" id="btnGuardar">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const URL_API_GOOGLE = "https://script.google.com/macros/s/AKfycbzJHg8nRmOcy08gsy0_cvuOVPnQtNlpaPFmQAiFyfIwhPW1xU6tZPJao6X44h9eaPPS/exec";
let todosLosDatos = [];
let imagenGlobalBase64 = ""; 
let modalInstancia = null;

// Inicializar el objeto modal de Bootstrap correctamente de manera global
document.addEventListener("DOMContentLoaded", () => {
    modalInstancia = new bootstrap.Modal(document.getElementById('modalRegistro'));
    cargarDatos();
});

function notificar(mensaje, colorFondo = "#1e293b") {
    const alerta = document.getElementById('alertaFlotante');
    alerta.innerText = mensaje;
    alerta.style.backgroundColor = colorFondo;
    alerta.style.display = 'block';
    setTimeout(() => { alerta.style.display = 'none'; }, 3500);
}

document.getElementById('fotoFile').addEventListener('change', function(e) {
    if (this.files && this.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            imagenGlobalBase64 = e.target.result; 
            document.getElementById('previewCont').innerHTML = `<img src="${imagenGlobalBase64}" style="width:100%; height:100%; object-fit:cover;">`;
            document.getElementById('iconoCamara').style.display = 'none'; 
            notificar("📸 Fotografía cargada en el formulario", "#4f46e5");
        }
        reader.readAsDataURL(this.files[0]);
    }
});

async function cargarDatos() {
    try {
        const respuesta = await fetch(URL_API_GOOGLE);
        const resultado = await respuesta.json();
        if (resultado.status === "success") {
            todosLosDatos = resultado.data.reverse();
            document.getElementById('statTotal').innerText = todosLosDatos.length;
            renderizarListaMovil(todosLosDatos);
        }
    } catch (error) {
        document.getElementById('listaMovil').innerHTML = `<div class="alert alert-danger text-center m-2" style="font-size:0.8rem;">⚠️ Error de conexión a Google Sheets.</div>`;
    }
}

function renderizarListaMovil(datos) {
    const contenedor = document.getElementById('listaMovil');
    if (datos.length === 0) {
        contenedor.innerHTML = `<div class="text-center py-5 text-muted" style="font-size:0.85rem">No existen registros agregados.</div>`;
        return;
    }

    contenedor.innerHTML = datos.map(row => {
        const miniatura = row.foto && row.foto.trim().startsWith('data:image')
            ? `<img src="${row.foto}" class="img-avatar" alt="Cultor">` 
            : `<div class="w-100 h-100 bg-light d-flex align-items-center justify-content-center text-muted"><i class="fa-solid fa-user fa-lg"></i></div>`;

        return `
            <div class="card card-custom p-3 mb-2 bg-white">
                <div class="d-flex align-items-center">
                    <div class="me-3">
                        <div class="avatar-container">
                            ${miniatura}
                        </div>
                    </div>
                    <div class="flex-grow-1">
                        <h6 class="mb-0 fw-bold text-dark" style="font-size:0.9rem">${row.nombre}</h6>
                        <small class="text-muted d-block" style="font-size: 0.75rem; margin-top:2px;">C.I: ${row.cedula} • ${row.municipio}</small>
                        <span class="badge mt-1" style="background-color:#e0f2fe; color:#0369a1; font-size:0.65rem;">${row.especialidad}</span>
                    </div>
                    <div class="dropdown">
                        <button class="btn btn-link text-muted p-1" data-bs-toggle="dropdown"><i class="fa-solid fa-ellipsis-vertical fa-lg"></i></button>
                        <ul class="dropdown-menu dropdown-menu-end border-0 shadow-lg">
                            <li><a class="dropdown-item py-2" href="#" onclick="abrirParaEditar('${row.cedula}'); return false;"><i class="fa-solid fa-marker me-2 text-warning"></i>Modificar</a></li>
                            <li><a class="dropdown-item py-2 text-danger" href="#" onclick="eliminarFila('${row.cedula}'); return false;"><i class="fa-solid fa-trash-can me-2"></i>Eliminar</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

function abrirParaCrear() {
    document.getElementById('formularioCenso').reset();
    document.getElementById('action_type').value = "CREAR";
    document.getElementById('cedula').readOnly = false;
    document.getElementById('modalTitulo').innerText = "NUEVO CENSO";
    document.getElementById('previewCont').innerHTML = "";
    document.getElementById('iconoCamara').style.display = 'block';
    imagenGlobalBase64 = ""; 
    modalInstancia.show();
}

function abrirParaEditar(cedula) {
    const registro = todosLosDatos.find(d => d.cedula.toString().trim() === cedula.toString().trim());
    if (!registro) return;

    document.getElementById('action_type').value = "ACTUALIZAR";
    document.getElementById('modalTitulo').innerText = "MODIFICAR REGISTRO";
    
    document.getElementById('municipio').value = registro.municipio || '';
    document.getElementById('parroquia').value = registro.parroquia || '';
    document.getElementById('comuna').value = registro.comuna || '';
    document.getElementById('comunidad').value = registro.comunidad || '';
    document.getElementById('cedula').value = registro.cedula || '';
    document.getElementById('cedula').readOnly = true; 
    document.getElementById('nombre').value = registro.nombre || '';
    document.getElementById('sexo').value = registro.sexo || '';
    document.getElementById('artesania').value = registro.artesania || '';
    document.getElementById('especialidad').value = registro.especialidad || '';
    document.getElementById('dequienaprendio').value = registro.dequienaprendio || '';
    document.getElementById('enfermedadesquetrata').value = registro.enfermedadesquetrata || '';
    document.getElementById('plantasoproductosqueusa').value = registro.plantasoproductosqueusa || '';
    document.getElementById('observaciones').value = registro.observaciones || '';
    
    if(registro.fechanacimiento) {
        try { document.getElementById('fechanacimiento').value = new Date(registro.fechanacimiento).toISOString().substring(0, 10); } catch(e){}
    } else {
        document.getElementById('fechanacimiento').value = '';
    }

    if (registro.foto && registro.foto.trim().startsWith('data:image')) {
        imagenGlobalBase64 = registro.foto;
        document.getElementById('previewCont').innerHTML = `<img src="${imagenGlobalBase64}" style="width:100%; height:100%; object-fit:cover;">`;
        document.getElementById('iconoCamara').style.display = 'none';
    } else {
        document.getElementById('previewCont').innerHTML = "";
        document.getElementById('iconoCamara').style.display = 'block';
        imagenGlobalBase64 = "";
    }

    modalInstancia.show();
}

document.getElementById('formularioCenso').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('btnGuardar');
    const tipoAccion = document.getElementById('action_type').value;
    
    btn.disabled = true;
    btn.innerText = "Procesando...";

    const payload = {
        accion: tipoAccion,
        municipio: document.getElementById('municipio').value,
        parroquia: document.getElementById('parroquia').value,
        comuna: document.getElementById('comuna').value,
        comunidad: document.getElementById('comunidad').value,
        cedula: document.getElementById('cedula').value,
        nombre: document.getElementById('nombre').value,
        fechanacimiento: document.getElementById('fechanacimiento').value,
        sexo: document.getElementById('sexo').value,
        artesania: document.getElementById('artesania').value,
        especialidad: document.getElementById('especialidad').value,
        dequienaprendio: document.getElementById('dequienaprendio').value,
        enfermedadesquetrata: document.getElementById('enfermedadesquetrata').value,
        plantasoproductosqueusa: document.getElementById('plantasoproductosqueusa').value,
        observaciones: document.getElementById('observaciones').value,
        foto: imagenGlobalBase64 
    };

    // Envío limpio eliminando el bloqueo de no-cors para poder capturar respuestas y evitar fallos de lectura en Google Script
    fetch(URL_API_GOOGLE, { 
        method: "POST", 
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload) 
    })
    .then(res => res.json())
    .then(datos => {
        modalInstancia.hide();
        if(tipoAccion === "CREAR") {
            notificar("🎉 Registro guardado con éxito", "#22c55e");
        } else {
            notificar("✏️ Registro modificado correctamente", "#eab308");
        }
        cargarDatos();
    })
    .catch(err => {
        // En Google Web Apps un redireccionamiento exitoso a veces puede caer en catch si las políticas CORS del navegador fallan localmente,
        // por seguridad cerramos el modal y actualizamos.
        modalInstancia.hide();
        notificar("Sync ejecutado", "#0284c7");
        cargarDatos();
    })
    .finally(() => { btn.disabled = false; btn.innerText = "Guardar"; });
});

function eliminarFila(cedula) {
    if (confirm(`¿Está seguro de eliminar el registro C.I: ${cedula}?`)) {
        const payload = { accion: "ELIMINAR", cedula: cedula };
        fetch(URL_API_GOOGLE, { 
            method: "POST", 
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload) 
        })
        .then(() => {
            notificar("🗑️ Registro eliminado", "#ef4444");
            cargarDatos();
        })
        .catch(() => {
            notificar("🗑️ Petición de eliminación enviada", "#ef4444");
            cargarDatos();
        });
    }
}

document.getElementById('inputBuscar').addEventListener('input', function() {
    const query = this.value.toLowerCase();
    const filtrados = todosLosDatos.filter(d => 
        (d.nombre || '').toLowerCase().includes(query) || 
        (d.cedula || '').toString().includes(query)
    );
    renderizarListaMovil(filtrados);
});
</script>
</body>
</html>
