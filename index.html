<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIAHO - Panel Avanzado de Gestión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="manifest" href="manifest.json">
    <style>
        .card-stats { transition: transform 0.2s; }
        .card-stats:hover { transform: translateY(-3px); }
        .img-preview { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="#">
            <i class="fa-solid fa-chart-pie me-2 text-info"></i> 
            <b>SIAHO: Panel de Saberes Ancestrales</b>
        </a>
        <span class="badge bg-success" id="statusConexion">Conectado a la Nube</span>
    </div>
</nav>

<div class="container py-4">
    
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card card-stats bg-white border-0 shadow-sm p-3">
                <div class="d-flex align-items-center justify-content-between">
                    <div>
                        <h6 class="text-muted mb-1">Total Censados</h6>
                        <h3 class="mb-0" id="statTotal">0</h3>
                    </div>
                    <div class="bg-primary bg-opacity-10 p-3 rounded text-primary"><i class="fa-solid fa-users fa-xl"></i></div>
                </div>
            </div>
        </div>
        <div class="col-md-5">
            <div class="card border-0 shadow-sm p-3 h-100">
                <h6 class="text-muted mb-2"><i class="fa-solid fa-chart-simple text-info me-1"></i> Distribución por Municipio</h6>
                <div style="max-height: 140px;"><canvas id="graficoMunicipios"></canvas></div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm p-3 h-100 text-center justify-content-center">
                <button class="btn btn-primary btn-lg py-3 shadow-sm mb-2" data-bs-toggle="modal" data-bs-target="#modalRegistro">
                    <i class="fa-solid fa-user-plus me-2"></i> Nuevo Censo Manuel
                </button>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-3">
        <div class="card-header bg-white py-3 border-0 d-flex align-items-center justify-content-between flex-wrap gap-2">
            <h5 class="mb-0 text-dark"><i class="fa-solid fa-clock-rotate-left me-2 text-secondary"></i> Historial de Registros Ordenado</h5>
            <div class="d-flex gap-2">
                <input type="text" id="inputBuscar" class="form-control" placeholder="Buscar por cédula o nombre...">
                <select id="selectEspecialidad" class="form-select" style="width: 200px;">
                    <option value="">Todas las Especialidades</option>
                </select>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Foto</th>
                        <th>Cédula</th>
                        <th>Nombre</th>
                        <th>Ubicación</th>
                        <th>Especialidad</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaCuerpo">
                    <tr>
                        <td colspan="6" class="text-center py-5 text-muted">
                            <div class="spinner-border text-primary mb-2" role="status"></div>
                            <br>Sincronizando registros con Google Sheets...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="modalRegistro" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title"><i class="fa-solid fa-file-signature me-2"></i> Formulario de Censo Manual</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="formularioCenso">
                <div class="modal-body p-4 row g-3">
                    <div class="col-md-6">
                        <label class="form-label font-monospace">Municipio</label>
                        <input type="text" class="form-control" id="municipio" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Parroquia</label>
                        <input type="text" class="form-control" id="parroquia" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Comuna</label>
                        <input type="text" class="form-control" id="comuna" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Comunidad</label>
                        <input type="text" class="form-control" id="comunidad" required>
                    </div>
                    <hr class="my-3">
                    <div class="col-md-4">
                        <label class="form-label">Cédula</label>
                        <input type="text" class="form-control" id="cedula" required>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label">Nombres y Apellidos</label>
                        <input type="text" class="form-control" id="nombre" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Especialidad</label>
                        <input type="text" class="form-control" id="especialidad" placeholder="Ej: Artesano, Partera..." required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label"><i class="fa-solid fa-camera text-primary me-1"></i> Cargar Imagen / Foto</label>
                        <input type="file" class="form-control" id="fotoFile" accept="image/*">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Enfermedades que trata (Si aplica)</label>
                        <input type="text" class="form-control" id="enfermedades_que_trata">
                    </div>
                    <div class="col-12">
                        <label class="form-label font-monospace">Observaciones generales</label>
                        <textarea class="form-control" id="observaciones" rows="2"></textarea>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="submit" class="btn btn-success" id="btnGuardar"><i class="fa-solid fa-cloud-arrow-up me-1"></i> Guardar en Google Sheet</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
// =========================================================================
// CONFIGURACIÓN: Reemplaza con tu URL definitiva de Google Apps Script (/exec)
// =========================================================================
const URL_API_GOOGLE = "https://script.google.com/macros/s/AKfycbwCL8Crbz3ln9Rxi9kOjf2F38M9IGpZa_fIlReOLIqfYWoMwR0SwinsXr3xK92ULGx5RQ/exec";
// =========================================================================

let todosLosDatos = [];
let chartMunicipios = null;

// Cargar registros e inicializar la interfaz
async function cargarDatos() {
    try {
        const respuesta = await fetch(URL_API_GOOGLE);
        const resultado = await respuesta.json();
        
        if (resultado.status === "success") {
            // Reversar el array para mostrar el historial ordenado (lo último creado sale de primero)
            todosLosDatos = resultado.data.reverse(); 
            document.getElementById('statTotal').innerText = todosLosDatos.length;
            rellenarFiltros(todosLosDatos);
            renderizarTabla(todosLosDatos);
            actualizarGraficos(todosLosDatos);
        }
    } catch (error) {
        document.getElementById('tablaCuerpo').innerHTML = `<tr><td colspan="6" class="text-center py-4 text-danger">⚠️ Error de enlace en la nube.</td></tr>`;
    }
}

// Pintar la tabla con soporte para previsualizar fotos Base64
function renderizarTabla(datos) {
    const cuerpo = document.getElementById('tablaCuerpo');
    if (datos.length === 0) {
        cuerpo.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">No hay registros almacenados.</td></tr>`;
        return;
    }

    cuerpo.innerHTML = datos.map(row => {
        // Si hay string de imagen base64, usarlo, de lo contrario poner una silueta genérica
        const miniatura = row.foto && row.foto.startsWith('data:image') 
            ? `<img src="${row.foto}" class="img-preview" alt="Foto">` 
            : `<div class="bg-secondary bg-opacity-20 rounded text-center d-flex align-items-center justify-content-center font-monospace text-muted" style="width:50px; height:50px;"><i class="fa-solid fa-image"></i></div>`;

        return `
        <tr>
            <td>${miniatura}</td>
            <td><b>${row.cedula}</b></td>
            <td>${row.nombre}</td>
            <td><small class="text-muted">${row.municipio} (${row.parroquia})</small></td>
            <td><span class="badge bg-info text-dark">${row.especialidad || 'General'}</span></td>
            <td class="text-center">
                <button class="btn btn-outline-danger btn-sm" onclick="eliminarRegistro('${row.cedula}')">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            </td>
        </tr>
    `}).join('');
}

// Gráfico dinámico usando Chart.js
function actualizarGraficos(datos) {
    const conteo = {};
    datos.forEach(d => { if (d.municipio) conteo[d.municipio] = (conteo[d.municipio] || 0) + 1; });

    const ctx = document.getElementById('graficoMunicipios').getContext('2d');
    if (chartMunicipios) chartMunicipios.destroy();

    chartMunicipios = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: Object.keys(conteo),
            datasets: [{
                label: 'Brigadas por Municipio',
                data: Object.values(conteo),
                backgroundColor: 'rgba(13, 110, 253, 0.7)',
                borderRadius: 4
            }]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
    });
}

// Procesar el guardado con conversión de imagen a Base64
document.getElementById('formularioCenso').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('btnGuardar');
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Procesando Archivos...`;

    const fileInput = document.getElementById('fotoFile');
    let base64Image = "";

    // Convertir foto a Base64 si el usuario seleccionó un archivo
    if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        base64Image = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result);
            reader.readAsDataURL(file);
        });
    }

    const payload = {
        accion: "CREAR",
        municipio: document.getElementById('municipio').value,
        parroquia: document.getElementById('parroquia').value,
        comuna: document.getElementById('comuna').value,
        comunidad: document.getElementById('comunidad').value,
        cedula: document.getElementById('cedula').value,
        nombre: document.getElementById('nombre').value,
        especialidad: document.getElementById('especialidad').value,
        enfermedades_que_trata: document.getElementById('enfermedades_que_trata').value,
        observaciones: document.getElementById('observaciones').value,
        foto: base64Image
    };

    fetch(URL_API_GOOGLE, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) })
    .then(() => {
        alert("🎉 Registro e imagen sincronizados exitosamente en Google Sheets.");
        bootstrap.Modal.getInstance(document.getElementById('modalRegistro')).hide();
        document.getElementById('formularioCenso').reset();
        cargarDatos();
    })
    .finally(() => { btn.disabled = false; btn.innerHTML = `Guardar en Google Sheet`; });
});

// Función para solicitar borrado por Cédula a la API
function eliminarRegistro(cedula) {
    if (confirm(`¿Estás seguro de que deseas eliminar permanentemente el registro con Cédula: ${cedula}?`)) {
        const payload = { accion: "ELIMINAR", cedula: cedula };
        
        fetch(URL_API_GOOGLE, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) })
        .then(() => {
            alert("🗑️ Registro eliminado de la hoja.");
            cargarDatos();
        });
    }
}

// Lógica de Filtros en vivo
function rellenarFiltros(datos) {
    const select = document.getElementById('selectEspecialidad');
    select.innerHTML = '<option value="">Todas las Especialidades</option>';
    const lista = [...new Set(datos.map(d => d.especialidad).filter(Boolean))];
    lista.forEach(esp => {
        const opt = document.createElement('option'); opt.value = esp; opt.textContent = esp; select.appendChild(opt);
    });
}

document.getElementById('inputBuscar').addEventListener('input', filtrar);
document.getElementById('selectEspecialidad').addEventListener('change', filtrar);

function filtrar() {
    const query = document.getElementById('inputBuscar').value.toLowerCase();
    const esp = document.getElementById('selectEspecialidad').value;
    const filtrados = todosLosDatos.filter(d => {
        const matchTxt = (d.nombre || '').toLowerCase().includes(query) || (d.cedula || '').toString().includes(query);
        const matchEsp = esp === "" || d.especialidad === esp;
        return matchTxt && matchEsp;
    });
    renderizarTabla(filtrados);
}

// Inicializar al cargar
window.onload = cargarDatos;
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
